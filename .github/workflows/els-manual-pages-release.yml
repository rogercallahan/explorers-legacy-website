name: ELS website review and release
run-name: ELS website review by ${{ github.actor }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: els-website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'rogercallahan/explorers-legacy-website' &&
      github.actor == 'rogercallahan' &&
      github.triggering_actor == 'rogercallahan' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.stage.outputs.ready }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release safeguards
        run: python3 -m unittest discover -s tests -v

      - name: Identify immutable artifact
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          printf 'artifact_name=els-pages-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Validate references, assess readiness and stage website
        id: stage
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/prepare_release.py --stage "$RUNNER_TEMP/els-site"
          else
            python3 scripts/prepare_release.py --release --stage "$RUNNER_TEMP/els-site"
          fi

      - name: Upload this run's immutable website artifact
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/els-site
          retention-days: 7

      - name: Record artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.identity.outputs.artifact_name }}
        run: |
          python3 - <<'PY'
          import json, os
          evidence = {key: os.environ[key] for key in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'ARTIFACT_ID', 'ARTIFACT_NAME')}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\nArtifact identity:\n\n```json\n' + json.dumps(evidence, indent=2) + '\n```\n')
          PY

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a superseded release candidate
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote https://github.com/rogercallahan/explorers-legacy-website.git refs/heads/main | cut -f1)
          [[ "$latest" == "$GITHUB_SHA" ]]

      - name: Publish only after Roger's environment approval
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
