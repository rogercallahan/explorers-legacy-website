<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400"><rect width="960" height="400" fill="#071320"/><g font-family="Arial,sans-serif" fill="#f4ebd2"><text x="48" y="60" font-size="28" font-weight="bold">A journey begins with a measurement.</text><text x="48" y="125" font-size="23">Distance = Speed × Time</text><path d="M80 225 H870" stroke="#65d7d0" stroke-width="5"/><circle cx="80" cy="225" r="12" fill="#d4af37"/><text x="55" y="275" font-size="20">0 hours</text><circle cx="340" cy="225" r="12" fill="#d4af37"/><text x="315" y="275" font-size="20">1 hour</text><circle cx="600" cy="225" r="12" fill="#d4af37"/><text x="575" y="275" font-size="20">2 hours</text><circle cx="860" cy="225" r="12" fill="#d4af37"/><text x="835" y="275" font-size="20">3 hours</text><text x="48" y="340" font-size="24">10 kilometers/hour × 3 hours = 30 kilometers</text><text x="48" y="377" font-size="16" fill="#65d7d0">Constant speed example • not an orbital calculation</text></g></svg>