<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
<title id="title">How a planet creates a temporary dip in starlight</title>
<desc id="desc">Three telescope views: before the planet crosses the star, during its crossing, and after. Numbered points on the graph match those views: more light, slightly less light, then more light again. Planet size and the dip are exaggerated.</desc>
<rect width="960" height="740" fill="#071320"/>
<g font-family="Arial,sans-serif" fill="#f4ebd2" text-anchor="middle">
<text x="480" y="48" font-size="30" font-weight="bold">A planet passes in front of its star</text>
<text x="480" y="85" font-size="23">Three views from the telescope, in time order</text>
<g stroke="#344c5e" fill="none"><rect x="24" y="115" width="288" height="260" rx="14"/><rect x="336" y="115" width="288" height="260" rx="14"/><rect x="648" y="115" width="288" height="260" rx="14"/></g>
<g fill="#d4af37"><circle cx="168" cy="235" r="58"/><circle cx="480" cy="235" r="58"/><circle cx="792" cy="235" r="58"/></g>
<g fill="#071320" stroke="#65d7d0" stroke-width="3"><circle cx="72" cy="235" r="15"/><circle cx="480" cy="235" r="15"/><circle cx="888" cy="235" r="15"/></g>
<g font-size="24" font-weight="bold"><text x="168" y="153">1 BEFORE</text><text x="480" y="153">2 DURING</text><text x="792" y="153">3 AFTER</text></g>
<g font-size="22"><text x="168" y="329">More light reaches us</text><text x="480" y="329">A little light is blocked</text><text x="792" y="329">More light again</text></g>
<text x="480" y="413" font-size="23">The graph records light reaching the telescope</text>
<path d="M165 450 V635 H900" fill="none" stroke="#f4ebd2" stroke-width="2"/>
<g font-size="20" text-anchor="end"><text x="148" y="485">More light</text><text x="148" y="588">Less light</text></g>
<path d="M180 480 H365 L420 580 H620 L675 480 H890" fill="none" stroke="#65d7d0" stroke-width="5"/>
<g fill="#d4af37" stroke="#071320" stroke-width="3"><circle cx="270" cy="480" r="19"/><circle cx="520" cy="580" r="19"/><circle cx="780" cy="480" r="19"/></g>
<g fill="#071320" font-size="23" font-weight="bold"><text x="270" y="488">1</text><text x="520" y="588">2</text><text x="780" y="488">3</text></g>
<text x="520" y="531" font-size="22">Temporary dip</text>
<text x="535" y="674" font-size="23">Time moves forward →</text>
<text x="480" y="715" font-size="20" fill="#65d7d0">Conceptual illustration • planet size and brightness dip exaggerated</text>
</g></svg>